version: '3.8'

services:
  # Custom Caddy server for development
  caddy-dev:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: opendiscourse-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"   # Main web interface
      - "8081:8081"   # File server
      - "9090:9090"   # Metrics/monitoring
      - "443:443"     # HTTPS (if needed)
      - "80:80"       # HTTP redirect
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - ./docs:/srv/docs:ro
      - ./api:/srv/api:ro
      - ./logs:/var/log/caddy
      - ./data:/data
      - ./certs:/etc/ssl/caddy
    environment:
      - CADDY_ADMIN=off
      - ENV=development
    networks:
      - opendiscourse-dev
    depends_on:
      - api-backend
      - postgres-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI backend
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: opendiscourse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api:ro
      - ./opendiscourse:/app/opendiscourse:ro
      - ./requirements.txt:/app/requirements.txt:ro
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - RAG_DB_URL=postgresql://postgres:password@postgres-dev:5432/opendiscourse
      - REDIS_URL=redis://redis-dev:6379
    networks:
      - opendiscourse-dev
    depends_on:
      - postgres-dev
      - redis-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  postgres-dev:
    image: postgres:16-alpine
    container_name: opendiscourse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=opendiscourse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rag_db_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - opendiscourse-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis-dev:
    image: redis:7-alpine
    container_name: opendiscourse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - opendiscourse-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development tools container
  dev-tools:
    image: alpine:latest
    container_name: opendiscourse-tools
    volumes:
      - .:/workspace:rw
    working_dir: /workspace
    command: tail -f /dev/null
    networks:
      - opendiscourse-dev

networks:
  opendiscourse-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
