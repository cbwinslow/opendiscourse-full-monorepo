apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-config
  namespace: kube-system
data:
  ceph.conf: |
    [global]
    fsid = <your-fsid>
    mon_initial_members = node1,node2,node3
    mon_host = <node1-ip>,<node2-ip>,<node3-ip>
    public_network = 172.28.158.0/24
    cluster_network = 172.28.158.0/24
    auth_cluster_required = cephx
    auth_service_required = cephx
    auth_client_required = cephx
    osd_pool_default_size = 3
    osd_pool_default_min_size = 2
    osd_pool_default_pg_num = 128
    osd_pool_default_pgp_num = 128
    osd_crush_chooseleaf_type = 0
    osd_crush_update_on_start = true
    osd_crush_update_min_interval = 300
    osd_crush_update_max_interval = 3600
    osd_crush_update_min_sample = 1000
    osd_crush_update_max_sample = 10000
    osd_crush_update_min_change = 0.01
    osd_crush_update_max_change = 0.10
    osd_crush_update_min_weight = 0.01
    osd_crush_update_max_weight = 1.00
    osd_crush_update_min_samples = 10
    osd_crush_update_max_samples = 100
