[metadata]
description-file = README.md

[tool:isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[pycodestyle]
max-line-length = 88
exclude = .git,__pycache__,.venv,venv

[flake8]
max-line-length = 88
exclude = .git,__pycache__,.venv,venv
per-file-ignores =
    # Allow `assert` in tests
    tests/*: S101
    # Ignore line length in tests
    tests/*: E501
