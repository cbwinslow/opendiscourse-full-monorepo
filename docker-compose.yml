version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opendiscourse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    volumes:
      - chroma-data:/chroma/.chroma/index
    ports:
      - "8000:8000"
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: opendiscourse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CHROMA_HOST: chroma
    depends_on:
      - postgres
      - chroma
volumes:
  postgres-data:
  chroma-data:
