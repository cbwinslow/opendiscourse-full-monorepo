name: CRDA Scan

# Overrides the main branch workflow to prevent failures
# This workflow runs but does nothing since credentials are not available
on:
  workflow_call:
    secrets:
      CRDA_KEY:
        required: false
      SNYK_TOKEN:
        required: false
  workflow_dispatch:
  pull_request_target:
    branches: [ "main" ]
    types: [ assigned, opened, synchronize, reopened, labeled, edited ]

permissions:
  contents: read

jobs:
  crda-scan:
    permissions:
      contents: read
      security-events: write
    name: Scan project vulnerabilities with CRDA
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if secrets are available
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.CRDA_KEY }}" || -n "${{ secrets.SNYK_TOKEN }}" ]]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "CRDA/Snyk secrets not configured. Skipping scan."
          fi

      - name: Skip scan
        if: steps.check-secrets.outputs.secrets_available != 'true'
        run: |
          echo "CRDA scan skipped - no credentials configured"
          echo "This is expected and not an error"
          
      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: actions/checkout@v4

      - name: CRDA Scan
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: redhat-actions/crda@v1
        with:
          crda_key: ${{ secrets.CRDA_KEY }}
          snyk_token: ${{ secrets.SNYK_TOKEN }}
