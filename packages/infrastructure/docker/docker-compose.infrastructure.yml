   networks:
     - opendiscourse-net
   volumes:
     - consul_data:/consul/data
     - consul_config:/consul/config
   command: >
     agent -server -retry-join=consul-server1 -node=server2 -bind=10.13.0.11
     -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
   depends_on:
     - consul-server1

