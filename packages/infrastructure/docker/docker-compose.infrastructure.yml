   ports:
     - "8080:8080"
   healthcheck:
     test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
     interval: 30s
     timeout: 5s
     retries: 3

 keycloak-db:
   image: postgres:16-alpine
   container_name: keycloak-db
   networks:
     - opendiscourse-net
   environment:
     POSTGRES_DB: keycloak
     POSTGRES_USER: keycloak
     POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
   volumes:
     - keycloak_db_data:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U keycloak"]
     interval: 10s
     retries: 5

 k3s-server:
   image: rancher/k3s:v1.29.2-k3s1
   container_name: k3s-server
   networks:
     - opendiscourse-net
   privileged: true
   volumes:
     - k3s_data:/var/lib/rancher/k3s
     - /etc/localtime:/etc/localtime:ro
   command: >
     server --cluster-init
     --tls-san cloudcurio.cc
     --datastore-endpoint="postgres://${OPD_POSTGRES_USER}:${OPD_POSTGRES_PASSWORD}@postgres:5432/${OPD_POSTGRES_DB}"
     --consul-datacenter=opendiscourse
     --consul-server=http://consul-server1:8500
   environment:
     K3S_KUBECONFIG_MODE: "644"
   depends_on:
     - consul-server1
     - postgres

  coolify:
    image: coolify/coolify:latest
    container_name: opendiscourse-coolify
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3001:3000"
    environment:
      - COOLIFY_APP_PORT=3000
      - COOLIFY_SECRET_KEY=${COOLIFY_SECRET_KEY}
      - COOLIFY_DB_URL=postgresql://${OPD_POSTGRES_USER}:${OPD_POSTGRES_PASSWORD}@postgres:5432/${OPD_POSTGRES_DB}
      - COOLIFY_HETZNER_API_KEY=${OPD_HCLOUD_TOKEN}
    volumes:
      - coolify_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  consul-server1:
    image: consul:1.17
    container_name: consul-server1
    networks:
      opendiscourse-net:
        ipv4_address: 10.13.0.10
    volumes:
      - consul_data:/consul/data
      - consul_config:/consul/config
    command: >
      agent -server -bootstrap-expect=3 -node=server1 -bind=10.13.0.10
      -client=0.0.0.0 -ui -data-dir=/consul/data -config-dir=/consul/config
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  timescaledb_data:
  rabbitmq_data:
  grafana_data:
  loki_data:
  coolify_data:
  consul_data:
  consul_config:
  k3s_data:
  keycloak_db_data:

networks:
  opendiscourse-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.0.0/24
  coolify_data:
  consul_data:
  consul_config:

