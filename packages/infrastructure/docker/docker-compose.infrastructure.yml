version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opendiscourse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opendiscourse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: opendiscourse-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: timescale
      POSTGRES_PASSWORD: timescale
      POSTGRES_DB: telemetry
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: opendiscourse-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: opendiscourse-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana-oss:latest
    container_name: opendiscourse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: opendiscourse-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  netdata:
    image: netdata/netdata:latest
    container_name: opendiscourse-netdata
    restart: unless-stopped
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3

 consul-server1:
   image: consul:1.17
   container_name: consul-server1
   networks:
     opendiscourse-net:
       ipv4_address: 10.13.0.10
   volumes:
     - consul_data:/consul/data
     - consul_config:/consul/config
   command: >
     agent -server -bootstrap-expect=3 -node=server1 -bind=10.13.0.10
     -client=0.0.0.0 -ui -data-dir=/consul/data -config-dir=/consul/config
   ports:
     - "8500:8500"
     - "8600:8600/udp"
   healthcheck:
     test: ["CMD", "curl", "--fail", "http://localhost:8500/v1/status/leader"]
     interval: 30s
     timeout: 5s
     retries: 3

 consul-server2:
   image: consul:1.17
   container_name: consul-server2
   networks:
     opendiscourse-net:
       ipv4_address: 10.13.0.11
   volumes:
     - consul_data:/consul/data
     - consul_config:/consul/config
   command: >
     agent -server -retry-join=consul-server1 -node=server2 -bind=10.13.0.11
     -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
   depends_on:
     - consul-server1

 consul-server3:
   image: consul:1.17
   container_name: consul-server3
   networks:
     opendiscourse-net:
       ipv4_address: 10.13.0.12
   volumes:
     - consul_data:/consul/data
     - consul_config:/consul/config
   command: >
     agent -server -retry-join=consul-server1 -node=server3 -bind=10.13.0.12
     -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
   depends_on:
     - consul-server1

 keycloak:
   image: quay.io/keycloak/keycloak:24.0
   container_name: keycloak
   networks:
     opendiscourse-net:
       ipv4_address: 10.13.0.13
   environment:
     KEYCLOAK_ADMIN: admin
     KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
     KC_DB: postgres
     KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
     KC_DB_USERNAME: keycloak
     KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
     KC_HOSTNAME: auth.cloudcurio.cc
     KC_PROXY: edge
   depends_on:
     - keycloak-db
   ports:
     - "8080:8080"
   healthcheck:
     test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
     interval: 30s
     timeout: 5s
     retries: 3

 keycloak-db:
   image: postgres:16-alpine
   container_name: keycloak-db
   networks:
     opendiscourse-net:
       ipv4_address: 10.13.0.14
   environment:
     POSTGRES_DB: keycloak
     POSTGRES_USER: keycloak
     POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
   volumes:
     - keycloak_db_data:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U keycloak"]
     interval: 10s
     retries: 5

 k3s-server:
   image: rancher/k3s:v1.29.2-k3s1
   container_name: k3s-server
   networks:
     opendiscourse-net:
       ipv4_address: 10.13.0.15
   privileged: true
   volumes:
     - k3s_data:/var/lib/rancher/k3s
     - /etc/localtime:/etc/localtime:ro
   command: >
     server --cluster-init
     --tls-san cloudcurio.cc
     --datastore-endpoint="postgres://${OPD_POSTGRES_USER}:${OPD_POSTGRES_PASSWORD}@postgres:5432/${OPD_POSTGRES_DB}"
     --consul-datacenter=opendiscourse
     --consul-server=http://consul-server1:8500
   environment:
     K3S_KUBECONFIG_MODE: "644"
   depends_on:
     - consul-server1
     - postgres

 consul-server1:
   image: consul:1.17
   container_name: consul-server1
   networks:
     - opendiscourse-net
   volumes:
     - consul_data:/consul/data
     - consul_config:/consul/config
   command: >
     agent -server -bootstrap-expect=3 -node=server1 -bind=10.13.0.10
     -client=0.0.0.0 -ui -data-dir=/consul/data -config-dir=/consul/config
   ports:
     - "8500:8500"
     - "8600:8600/udp"
   healthcheck:
     test: ["CMD", "curl", "--fail", "http://localhost:8500/v1/status/leader"]
     interval: 30s
     timeout: 5s
     retries: 3

