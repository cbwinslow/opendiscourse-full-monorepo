<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Interface</title>
    <link rel="stylesheet" href="/web/static/css/theme.css">
</head>
<body>
<nav>
    <a href="/web/index.html">Home</a>
</nav>
<div class="container">
    <h1>RAG Query</h1>
    <input type="text" id="question" size="60" placeholder="Ask about laws...">
    <button onclick="ask()">Ask</button>
<pre id="answer"></pre>
</div>
<script>
async function ask(){
 const q=document.getElementById('question').value;
 const resp=await fetch('/api/rag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
 const json=await resp.json();
 document.getElementById('answer').textContent=json.answer||JSON.stringify(json);
}
</script>
<script src="/web/static/js/track.js"></script>
</body>
</html>
