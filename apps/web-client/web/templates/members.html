{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h1>Government Members</h1>
        <p class="lead">Browse profiles of government officials at all levels.</p>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <form id="filter-form">
                    <div class="input-group">
                        <input type="text" class="form-control" id="search-input" placeholder="Search members...">
                        <button class="btn btn-outline-secondary" type="button" id="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <div class="d-flex justify-content-end">
                    <select class="form-select w-auto" id="sort-select">
                        <option value="name">Sort by Name</option>
                        <option value="created_at">Sort by Date Added</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div id="members-list">
            <!-- Members will be loaded here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading members...</p>
            </div>
        </div>
        
        <nav aria-label="Members pagination">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded here -->
            </ul>
        </nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let currentSearch = '';
    let currentSort = 'name';
    
    // Load members when page loads
    document.addEventListener('DOMContentLoaded', function() {
        loadMembers();
    });
    
    // Search functionality
    document.getElementById('search-btn').addEventListener('click', function() {
        currentSearch = document.getElementById('search-input').value;
        currentPage = 1;
        loadMembers();
    });
    
    // Sort functionality
    document.getElementById('sort-select').addEventListener('change', function() {
        currentSort = this.value;
        currentPage = 1;
        loadMembers();
    });
    
    function loadMembers() {
        // Show loading state
        document.getElementById('members-list').innerHTML = `
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading members...</p>
            </div>
        `;
        
        // Build query parameters
        const params = new URLSearchParams();
        params.append('page', currentPage);
        params.append('per_page', 20);
        params.append('sort', currentSort);
        
        if (currentSearch) {
            params.append('search', currentSearch);
        }
        
        // Fetch members
        fetch(`/api/members?${params.toString()}`)
            .then(response => response.json())
            .then(data => {
                displayMembers(data);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('members-list').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Error loading members. Please try again.
                    </div>
                `;
            });
    }
    
    function displayMembers(data) {
        let html = '';
        
        if (data.members && data.members.length > 0) {
            html += '<div class="row">';
            
            data.members.forEach(member => {
                html += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100">
                            ${member.image_url ? 
                                `<img src="${member.image_url}" class="card-img-top" alt="${member.name}" style="height: 200px; object-fit: cover;">` : 
                                `<div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
                                    <i class="fas fa-user fa-3x text-muted"></i>
                                </div>`
                            }
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">
                                    <a href="/member/${member.id}" class="text-decoration-none">${member.name}</a>
                                </h5>
                                ${member.current_role ? `<p class="card-text"><small class="text-muted">${member.current_role}</small></p>` : ''}
                                ${member.party ? `<span class="badge bg-secondary">${member.party}</span>` : ''}
                                <div class="mt-auto">
                                    <a href="/member/${member.id}" class="btn btn-primary">View Profile</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
        } else {
            html = `
                <div class="text-center py-5">
                    <i class="fas fa-users fa-3x text-muted mb-3"></i>
                    <h3>No members found</h3>
                    <p class="text-muted">Try adjusting your search criteria.</p>
                </div>
            `;
        }
        
        document.getElementById('members-list').innerHTML = html;
        
        // Update pagination
        updatePagination(data.pagination);
    }
    
    function updatePagination(pagination) {
        let html = '';
        
        if (pagination.pages > 1) {
            // Previous button
            html += `
                <li class="page-item ${pagination.page === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${pagination.page - 1}">Previous</a>
                </li>
            `;
            
            // Page numbers
            for (let i = 1; i <= pagination.pages; i++) {
                if (i === 1 || i === pagination.pages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
                    html += `
                        <li class="page-item ${i === pagination.page ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>
                    `;
                } else if (i === pagination.page - 3 || i === pagination.page + 3) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            // Next button
            html += `
                <li class="page-item ${pagination.page === pagination.pages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${pagination.page + 1}">Next</a>
                </li>
            `;
        }
        
        document.getElementById('pagination').innerHTML = html;
        
        // Add event listeners to pagination links
        document.querySelectorAll('#pagination .page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = parseInt(this.getAttribute('data-page'));
                if (!isNaN(page)) {
                    currentPage = page;
                    loadMembers();
                }
            });
        });
    }
</script>
{% endblock %}
