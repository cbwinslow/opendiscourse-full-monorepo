{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h1>Identified Discrepancies</h1>
        <p class="lead">Potential inconsistencies between voting records and public statements.</p>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <form id="filter-form">
                    <div class="input-group">
                        <input type="text" class="form-control" id="search-input" placeholder="Search by issue or member...">
                        <button class="btn btn-outline-secondary" type="button" id="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <div class="d-flex justify-content-end">
                    <div class="form-check form-switch me-3">
                        <input class="form-check-input" type="checkbox" id="show-resolved">
                        <label class="form-check-label" for="show-resolved">Show Resolved</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="discrepancies-list">
            <!-- Discrepancies will be loaded here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading discrepancies...</p>
            </div>
        </div>
        
        <nav aria-label="Discrepancies pagination">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded here -->
            </ul>
        </nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let currentSearch = '';
    let showResolved = false;
    
    // Load discrepancies when page loads
    document.addEventListener('DOMContentLoaded', function() {
        loadDiscrepancies();
    });
    
    // Search functionality
    document.getElementById('search-btn').addEventListener('click', function() {
        currentSearch = document.getElementById('search-input').value;
        currentPage = 1;
        loadDiscrepancies();
    });
    
    // Show resolved toggle
    document.getElementById('show-resolved').addEventListener('change', function() {
        showResolved = this.checked;
        currentPage = 1;
        loadDiscrepancies();
    });
    
    function loadDiscrepancies() {
        // Show loading state
        document.getElementById('discrepancies-list').innerHTML = `
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading discrepancies...</p>
            </div>
        `;
        
        // Build query parameters
        const params = new URLSearchParams();
        params.append('page', currentPage);
        params.append('per_page', 20);
        
        if (currentSearch) {
            params.append('issue', currentSearch);
        }
        
        if (showResolved) {
            params.append('resolved', 'true');
        } else {
            params.append('resolved', 'false');
        }
        
        // Fetch discrepancies
        fetch(`/api/discrepancies?${params.toString()}`)
            .then(response => response.json())
            .then(data => {
                displayDiscrepancies(data);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('discrepancies-list').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Error loading discrepancies. Please try again.
                    </div>
                `;
            });
    }
    
    function displayDiscrepancies(data) {
        let html = '';
        
        if (data.discrepancies && data.discrepancies.length > 0) {
            html += `
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Issue</th>
                                <th>Vote Position</th>
                                <th>Statement Position</th>
                                <th>Confidence</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            data.discrepancies.forEach(disc => {
                html += `
                    <tr>
                        <td>
                            <a href="/member/${disc.person_id}">${disc.person_name}</a>
                        </td>
                        <td>${disc.issue}</td>
                        <td>
                            <span class="badge ${disc.vote_position === 'yes' ? 'bg-success' : disc.vote_position === 'no' ? 'bg-danger' : 'bg-secondary'}">
                                ${disc.vote_position}
                            </span>
                        </td>
                        <td>
                            <span class="badge ${disc.statement_position === 'positive' ? 'bg-success' : disc.statement_position === 'negative' ? 'bg-danger' : 'bg-secondary'}">
                                ${disc.statement_position}
                            </span>
                        </td>
                        <td>
                            <div class="progress" style="height: 10px;">
                                <div class="progress-bar" role="progressbar" 
                                     style="width: ${disc.confidence_score * 100}%;" 
                                     aria-valuenow="${disc.confidence_score * 100}" 
                                     aria-valuemin="0" aria-valuemax="100">
                                </div>
                            </div>
                            <small class="text-muted">${Math.round(disc.confidence_score * 100)}%</small>
                        </td>
                        <td>${disc.created_at}</td>
                        <td>
                            ${disc.resolved ? 
                                '<span class="badge bg-success">Resolved</span>' : 
                                '<span class="badge bg-warning">Pending</span>'
                            }
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
        } else {
            html = `
                <div class="text-center py-5">
                    <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                    <h3>No discrepancies found</h3>
                    <p class="text-muted">No potential inconsistencies identified at this time.</p>
                </div>
            `;
        }
        
        document.getElementById('discrepancies-list').innerHTML = html;
        
        // Update pagination
        updatePagination(data.pagination);
    }
    
    function updatePagination(pagination) {
        let html = '';
        
        if (pagination.pages > 1) {
            // Previous button
            html += `
                <li class="page-item ${pagination.page === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${pagination.page - 1}">Previous</a>
                </li>
            `;
            
            // Page numbers
            for (let i = 1; i <= pagination.pages; i++) {
                if (i === 1 || i === pagination.pages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
                    html += `
                        <li class="page-item ${i === pagination.page ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>
                    `;
                } else if (i === pagination.page - 3 || i === pagination.page + 3) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            // Next button
            html += `
                <li class="page-item ${pagination.page === pagination.pages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${pagination.page + 1}">Next</a>
                </li>
            `;
        }
        
        document.getElementById('pagination').innerHTML = html;
        
        // Add event listeners to pagination links
        document.querySelectorAll('#pagination .page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = parseInt(this.getAttribute('data-page'));
                if (!isNaN(page)) {
                    currentPage = page;
                    loadDiscrepancies();
                }
            });
        });
    }
</script>
{% endblock %}
