version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: opendiscourse-postgres
    environment:
      POSTGRES_USER: opendiscourse
      POSTGRES_PASSWORD: opendiscourse
      POSTGRES_DB: opendiscourse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres 
      -c shared_preload_libraries='pgvector'
      -c max_connections=200
      -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendiscourse"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin for database administration
  pgadmin:
    image: dpage/pgadmin4
    container_name: opendiscourse-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opendiscourse.net
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.12.3
    container_name: opendiscourse-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: your_api_key_here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Neo4j graph database
  neo4j:
    image: neo4j:5-community
    container_name: opendiscourse-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: opendiscourse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: opendiscourse-api-server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://opendiscourse:opendiscourse@postgres:5432/opendiscourse
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
    volumes:
      - ./apps/api-server:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Client
  web-client:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: opendiscourse-web-client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-server:8000
    depends_on:
      - api-server
    volumes:
      - ./apps/web-client:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: opendiscourse-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-server
      - web-client

volumes:
  postgres_data:
  pgadmin_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  caddy_data:
  caddy_config: