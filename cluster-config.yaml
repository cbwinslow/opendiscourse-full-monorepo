# Cluster Configuration
---
# Ceph Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-config
  namespace: kube-system
data:
  ceph.conf: |
    [global]
    fsid = $(uuidgen)
    mon_initial_members = cbwdellr720,cbwhpz
    mon_host = 172.28.158.179,172.28.16.143
    public_network = 172.28.0.0/16
    cluster_network = 172.28.0.0/16
    auth_cluster_required = cephx
    auth_service_required = cephx
    auth_client_required = cephx
    osd_pool_default_size = 2
    osd_pool_default_min_size = 1
    osd_pool_default_pg_num = 128
    osd_pool_default_pgp_num = 128
    osd_crush_chooseleaf_type = 0

---
# Kubernetes Configuration
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
metadata:
  name: kubernetes
kubernetesVersion: stable
controlPlaneEndpoint: "172.28.158.179:6443"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
apiServer:
  extraArgs:
    authorization-mode: Node,RBAC
controllerManager:
  extraArgs:
    horizontal-pod-autoscaler-use-rest-clients: "true"
    horizontal-pod-autoscaler-sync-period: "10s"
etcd:
  local:
    dataDir: /var/lib/etcd

---
# Storage Classes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd
provisioner: ceph.com/rbd
parameters:
  monitors: 172.28.158.179:6789,172.28.16.143:6789
  adminId: admin
  adminSecretName: ceph-secret
  adminSecretNamespace: kube-system
  pool: replicapool
  userId: kube
  userSecretName: ceph-secret-user
  imageFeatures: layering
  imageFormat: 2
  fsType: ext4
reclaimPolicy: Retain
